services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kbase
      POSTGRES_USER: kbase
      POSTGRES_PASSWORD: kbase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbase -d kbase"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      KBASE_DB_URL: postgresql+psycopg://kbase:kbase@db:5432/kbase
      KBASE_STORAGE_ROOT: /app/kb/items
      KBASE_INBOX_ROOT: /app/kb/inbox
      KBASE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: >
      sh -c "python scripts/init_db.py &&
      uvicorn kbase.interfaces.api.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/src --reload-dir /app/scripts"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./kb:/app/kb

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    depends_on:
      - api
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 5173
      VITE_API_PROXY_TARGET: http://api:8000
    command: >
      sh -c "if [ ! -d node_modules/react ]; then npm install; fi &&
      npm run dev -- --host 0.0.0.0 --port 5173 --strictPort --clearScreen false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

volumes:
  postgres_dev_data:
  frontend_node_modules:
